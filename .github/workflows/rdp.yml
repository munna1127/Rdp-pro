name: Windows-RDP-AnyDesk

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Download & Install AnyDesk
      run: |
        Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "AnyDesk.exe"
        Start-Process .\AnyDesk.exe -ArgumentList "--install `"C:\Program Files (x86)\AnyDesk`" --start-with-win --silent" -Wait

    - name: Set AnyDesk Unattended Password
      run: |
        echo "DostKaPass123!" | & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --set-password

    - name: Get AnyDesk ID
      run: |
        Start-Sleep -Seconds 5
        $anydesk_id = & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --get-id
        Write-Host "========================================"
        Write-Host "ANYDESK ID: $anydesk_id"
        Write-Host "PASSWORD:   DostKaPass123!"
        Write-Host "========================================"

    - name: Keep Alive Loop
      run: |
        $i = 1
        while ($i -le 360) {
            Start-Sleep -Seconds 60
            $i++
        }
        
