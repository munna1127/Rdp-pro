name: Windows-RDP-AnyDesk

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Download & Install AnyDesk
      run: |
        Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "AnyDesk.exe"
        Start-Process .\AnyDesk.exe -ArgumentList "--install `"C:\Program Files (x86)\AnyDesk`" --start-with-win --silent" -Wait

    - name: Set Unattended Password
      run: |
        # Space-free password set & restart service
        cmd.exe /c "echo TomarJi99| `"C:\Program Files (x86)\AnyDesk\AnyDesk.exe`" --set-password"
        Restart-Service -Name "AnyDesk" -Force
        Start-Sleep -Seconds 5

    - name: Get AnyDesk ID
      run: |
        $id = ""
        for ($i = 0; $i -lt 15; $i++) {
            Start-Sleep -Seconds 3
            $id = (cmd.exe /c "`"C:\Program Files (x86)\AnyDesk\AnyDesk.exe`" --get-id").Trim()
            if ($id -match '^\d+$') { break }
        }
        Write-Host "========================================"
        Write-Host "ANYDESK ID: $id"
        Write-Host "PASSWORD:   TomarJi99"
        Write-Host "========================================"

    - name: Keep Alive Loop
      run: |
        $i = 1
        while ($i -le 360) {
            Start-Sleep -Seconds 60
            $i++
        }
        
